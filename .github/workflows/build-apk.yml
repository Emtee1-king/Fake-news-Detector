name: Build APK

# Run it from the Actions tab (Run workflow), or it runs on every push.
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets you upload just the project .zip from a phone: it is unpacked here.
      - name: Find the project (unzip it if it was uploaded as a zip)
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)" ]; then
            ZIP="$(ls ./*.zip 2>/dev/null | head -n1)"
            if [ -z "$ZIP" ]; then echo "No project or .zip found in the repository."; exit 1; fi
            unzip -q "$ZIP"
          fi
          SETTINGS="$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      # Upload a trained model.json to the repository root to use it instead of the built-in one.
      - name: Use trained model if provided
        run: |
          if [ -f model.json ]; then
            cp model.json "$PROJECT_DIR/app/src/main/assets/model.json"
            echo "Using the model.json from the repository root."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK. Accept its licenses so Gradle can use it.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FakeNewsDetector-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
